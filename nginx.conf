server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /tiles/ {
        alias /tiles/;
        # Tile pyramid is immutable per render; safe to cache hard.
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
